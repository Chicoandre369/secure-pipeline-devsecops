name: Security Pipeline
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
  pull-requests: write
jobs:
  secrets:
    name: 1 - Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  sast:
    name: 2 - SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config auto --sarif --output semgrep.sarif --error || true
          ls -lh semgrep.sarif || echo "no sarif generated"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
  sca-and-container:
    name: 3 - SCA + Container (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS scan - DEBUG table
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Build image for scan
        run: docker build -t secure-demo:${{ github.sha }} .
      - name: Trivy Image scan - FAIL only on CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: secure-demo:${{ github.sha }}
          scanners: vuln
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL
          exit-code: "1"
      - name: Upload SARIF Image
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
  sbom:
    name: 4 - SBOM (Syft)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
      - name: Move SBOM to reports
        run: |
          mkdir -p reports
          ls -lh sbom.cyclonedx.json || echo "no sbom at root, searching"
          find . -name "*.cyclonedx.json" -o -name "sbom*.json" | head -20
          cp sbom.cyclonedx.json reports/sbom.cyclonedx.json || echo "cp failed"
          ls -lh reports/
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        if: hashFiles('reports/sbom.cyclonedx.json') != ''
        with:
          name: sbom
          path: reports/sbom.cyclonedx.json